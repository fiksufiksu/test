<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0a0a0a; --fg: #f0ece4; --accent: #ff6b2b; --muted: #444; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: 'DM Mono', monospace;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  .wrap { text-align: center; padding: 2rem; }
  .label {
    font-size: 0.7rem; letter-spacing: 0.25em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 2rem; opacity: 0;
    animation: fadeUp 0.6s 0.1s forwards;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 2px solid var(--muted); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 2rem;
    animation: spin 0.8s linear infinite, fadeUp 0.6s 0.2s both;
  }
  .msg { font-size: 1rem; opacity: 0; animation: fadeUp 0.6s 0.3s forwards; }
  .msg span { color: var(--accent); }
  .fallback {
    margin-top: 2.5rem; font-size: 0.72rem; color: var(--muted);
    opacity: 0; animation: fadeUp 0.6s 1.8s forwards;
  }
  .fallback a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">one moment</div>
  <div class="spinner"></div>
  <div class="msg">opening <span>amazon</span>...</div>
  <div class="fallback">
    not working? <a href="https://amzn.to/41f018p" id="fallback-link">tap here</a>
  </div>
</div>

<script>
  const AMAZON_URL = "https://amzn.to/41f018p";
  const ua = navigator.userAgent;
  const isAndroid = /android/i.test(ua);
  const isIOS = /iphone|ipad|ipod/i.test(ua);

  function redirect() {
    if (isIOS) {
      // x-safari-https:// forces out of IAB into Safari, then Safari handles Amazon universal link
      window.location.href = "x-safari-" + AMAZON_URL;
      setTimeout(() => { window.location.href = AMAZON_URL; }, 1500);
    } else if (isAndroid) {
      // googlechrome:// forces out of IAB into Chrome
      const chromeUrl = "googlechrome://" + AMAZON_URL.replace("https://", "");
      window.location.href = chromeUrl;
      setTimeout(() => { window.location.href = AMAZON_URL; }, 1500);
    } else {
      window.location.href = AMAZON_URL;
    }
  }

  setTimeout(redirect, 800);
</script>
</body>
</html>
